# 使用している GitHub Actions の更新を週1回プルリクエストで知らせる（自動マージはしない）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # 新しい版が出てから7日たってから知らせる（乗っ取られた版が出回る期間を避けるため。GitHub Docs「Optimizing PR creation for version updates」の cooldown）
    cooldown:
      default-days: 7
